<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231e1e2e'/><text x='4' y='24' font-family='monospace' font-size='18' font-weight='bold' fill='%23a6e3a1'>&#x3e;_</text></svg>" />
<script type="module" src="mini-terminal.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-page: #1a1a22;
  --bg-card: #242430;
  --bg-card-hover: #2c2c3a;
  --border: #333342;
  --border-hover: #44445a;
  --text-primary: #ededf2;
  --text-secondary: #9c9cb2;
  --text-tertiary: #6a6a80;
  --accent: #6366f1;
  --icon-bg: #2e2e3e;
  --icon-color: #a8a8be;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-page);
  background-image: radial-gradient(ellipse at 50% 0%, #22222e 0%, var(--bg-page) 70%);
  color: var(--text-primary);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.container {
  max-width: 1440px;
  margin: 0 auto;
  padding: 0 24px;
}

header {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 28px 0;
}

.header-left {
  flex-shrink: 0;
}

.wordmark {
  display: inline-block;
  font-size: 24px;
  font-weight: 600;
  letter-spacing: -0.5px;
  background: linear-gradient(135deg, #e2e8f0 0%, #a5b4fc 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-decoration: none;
}

.tagline {
  margin-top: 2px;
  font-size: 12px;
  color: var(--text-tertiary);
  font-weight: 400;
}

.header-right {
  flex-shrink: 0;
  text-align: right;
}

.header-counts {
  font-size: 12px;
  color: var(--text-tertiary);
  font-weight: 500;
}

.header-counts:empty {
  display: none;
}

.header-sessions {
  font-size: 12px;
  color: var(--text-tertiary);
  font-weight: 500;
  margin-top: 2px;
}

.header-sessions:empty {
  display: none;
}

.header-sessions .dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #22c55e;
  margin-right: 4px;
  vertical-align: middle;
  animation: pulse-dot 2s ease-in-out infinite;
}

.search-wrapper {
  position: relative;
  flex: 1;
  max-width: 400px;
}

.search-wrapper svg {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  color: var(--text-tertiary);
  pointer-events: none;
}

.search-input {
  width: 100%;
  padding: 9px 12px 9px 36px;
  font-size: 14px;
  font-family: inherit;
  color: var(--text-primary);
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.search-input::placeholder {
  color: var(--text-tertiary);
}

.search-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
}

/* ── "All apps" expander ───────────────────────────────────────────────
   Expanded, the grid just contains everything — hidden apps are drawn at
   full strength with no badge, because the only thing that separates them
   from the rest is that you asked to see them. What marks the boundary is
   this card: dashed and unfilled so it reads as a control among apps
   rather than an app itself. */
.card.more-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  background: transparent;
  border: 1px dashed var(--border);
  box-shadow: none;
  cursor: pointer;
  font: inherit;
  text-align: center;
}
.card.more-card:hover {
  background: rgba(99, 102, 241, 0.05);
  border-color: var(--accent);
}
.more-card svg { width: 24px; height: 24px; }
.more-icon {
  color: var(--text-tertiary);
  line-height: 0;
  margin-bottom: 10px;
  transition: color 0.2s;
}
.more-card:hover .more-icon { color: var(--accent); }
.more-label {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-primary);
  letter-spacing: -0.2px;
}
.more-count { font-size: 13px; color: var(--text-tertiary); }

.top-badge {
  display: inline-block;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 1px 5px;
  border-radius: 3px;
  vertical-align: middle;
}
.top-badge {
  color: #f59e0b;
  background: rgba(245, 158, 11, 0.1);
  border: 1px solid rgba(245, 158, 11, 0.25);
}
.default-badge {
  display: inline-block;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 1px 5px;
  border-radius: 3px;
  vertical-align: middle;
  color: #22c55e;
  background: rgba(34, 197, 94, 0.1);
  border: 1px solid rgba(34, 197, 94, 0.3);
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
  padding-bottom: 40px;
}
.grid[hidden] { display: none; }

.workspace-card { cursor: pointer; }
.workspace-card:hover .card-icon {
  box-shadow: 0 0 22px rgba(234, 179, 8, 0.30);
}

.ws-kebab {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 28px;
  height: 28px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
  background: transparent;
  border: none;
  color: var(--text-tertiary);
  cursor: pointer;
  opacity: 0;
  z-index: 2;
  transition: opacity .15s ease, background-color .15s ease, color .15s ease;
}
.ws-kebab svg { width: 16px; height: 16px; }
.workspace-card:hover .ws-kebab,
.workspace-card:focus-within .ws-kebab,
.ws-kebab.active { opacity: 1; }
.ws-kebab:hover, .ws-kebab.active {
  background: rgba(255,255,255,0.07);
  color: var(--text-primary);
}

.workspace-card .card-title.editing {
  outline: none;
  background: rgba(99, 102, 241, 0.10);
  border-radius: 4px;
  padding: 0 4px;
  box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.30);
  cursor: text;
  user-select: text;
}

.ws-new-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1.5px dashed var(--border);
  border-radius: 12px;
  padding: 24px;
  cursor: pointer;
  color: var(--text-tertiary);
  transition: background-color .2s ease, border-color .2s ease, color .2s ease, transform .15s ease;
  min-height: 100%;
  opacity: 0;
  transform: translateY(8px);
  user-select: none;
}
.ws-new-card.visible { opacity: 1; transform: translateY(0); transition: opacity .35s ease-out, transform .35s ease-out, background-color .2s ease, border-color .2s ease, color .2s ease; }
.ws-new-card:hover {
  background: rgba(99, 102, 241, 0.06);
  border-color: rgba(165, 180, 252, 0.45);
  border-style: solid;
  color: var(--text-secondary);
}
.ws-new-card:focus-visible {
  outline: none;
  border-color: rgba(165, 180, 252, 0.55);
  box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.20);
}
.ws-new-card.editing {
  border-style: solid;
  border-color: rgba(165, 180, 252, 0.45);
  background: rgba(99, 102, 241, 0.06);
  cursor: default;
  flex-direction: row;
  gap: 12px;
  padding: 18px;
  justify-content: flex-start;
}
.ws-new-icon {
  width: 44px;
  height: 44px;
  border-radius: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.03);
  flex-shrink: 0;
  transition: background-color .2s ease, color .2s ease;
}
.ws-new-icon svg { width: 22px; height: 22px; }
.ws-new-card:hover .ws-new-icon { background: rgba(99, 102, 241, 0.14); color: #a5b4fc; }
.ws-new-card.editing .ws-new-icon { background: rgba(99, 102, 241, 0.16); color: #a5b4fc; }
.ws-new-label {
  margin-top: 10px;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: -0.005em;
}
.ws-new-card.editing .ws-new-label { display: none; }
.ws-new-input {
  flex: 1;
  font-family: inherit;
  font-size: 15px;
  font-weight: 500;
  color: var(--text-primary);
  background: transparent;
  border: none;
  outline: none;
  padding: 0;
  letter-spacing: -0.01em;
  min-width: 0;
  display: none;
}
.ws-new-card.editing .ws-new-input { display: block; }
.ws-new-input::placeholder { color: var(--text-tertiary); font-weight: 400; }

html.narrow .ws-new-card { padding: 18px; min-height: 80px; }
html.narrow .ws-new-card.editing { padding: 14px 16px; }
html.narrow .ws-new-icon { width: 36px; height: 36px; border-radius: 8px; }
html.narrow .ws-new-icon svg { width: 18px; height: 18px; }
html.narrow .ws-new-input { font-size: 16px; }
html.narrow .ws-new-label { font-size: 12px; margin-top: 8px; }
html.touch .ws-new-card:active { transform: scale(0.98); background: rgba(99, 102, 241, 0.10); }

.ws-menu {
  position: fixed;
  z-index: 1000;
  min-width: 200px;
  padding: 6px;
  background: rgba(34, 34, 46, 0.92);
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px;
  box-shadow:
    0 16px 40px -10px rgba(0,0,0,0.65),
    0 4px 14px rgba(0,0,0,0.35),
    inset 0 1px 0 rgba(255,255,255,0.04);
  animation: ws-menu-in .14s cubic-bezier(.16,1,.3,1);
  font-family: inherit;
}
@keyframes ws-menu-in {
  from { opacity: 0; transform: translateY(-4px) scale(0.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.ws-menu-item {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  padding: 8px 12px 8px 10px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-primary);
  background: transparent;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-family: inherit;
  text-align: left;
  letter-spacing: -0.005em;
  transition: background-color .1s ease;
}
.ws-menu-item svg {
  width: 14px;
  height: 14px;
  color: var(--text-tertiary);
  flex-shrink: 0;
  transition: color .1s ease;
}
.ws-menu-item:hover { background: rgba(99, 102, 241, 0.20); }
.ws-menu-item:hover svg { color: #a5b4fc; }
.ws-menu-item.destructive { color: #f87171; }
.ws-menu-item.destructive svg { color: #f87171; opacity: 0.8; }
.ws-menu-item.destructive:hover { background: rgba(248, 113, 113, 0.16); }
.ws-menu-item.destructive:hover svg { color: #f87171; opacity: 1; }
.ws-menu-divider {
  height: 1px;
  margin: 5px 8px;
  background: rgba(255,255,255,0.06);
}

.ws-modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(8, 8, 12, 0.55);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1100;
  animation: ws-fade-in .18s ease-out;
}
@keyframes ws-fade-in { from { opacity: 0; } to { opacity: 1; } }
.ws-modal {
  background: linear-gradient(180deg, #2a2a38 0%, #232330 100%);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  padding: 22px 22px 18px;
  max-width: 420px;
  width: calc(100% - 32px);
  box-shadow:
    0 24px 80px -10px rgba(0,0,0,0.7),
    inset 0 1px 0 rgba(255,255,255,0.05);
  animation: ws-modal-in .22s cubic-bezier(.16,1,.3,1);
}
@keyframes ws-modal-in {
  from { opacity: 0; transform: translateY(8px) scale(0.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.ws-modal-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-primary);
  letter-spacing: -0.01em;
  margin-bottom: 8px;
}
.ws-modal-body {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.55;
  margin-bottom: 18px;
}
.ws-modal-body code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 12px;
  color: var(--text-primary);
  background: rgba(255,255,255,0.06);
  padding: 1px 6px;
  border-radius: 4px;
}
.ws-modal-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}
.ws-modal-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  padding: 8px 14px;
  border-radius: 8px;
  cursor: pointer;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.04);
  color: var(--text-secondary);
  transition: background .15s ease, border-color .15s ease, color .15s ease, transform .1s ease;
}
.ws-modal-btn:hover {
  background: rgba(255,255,255,0.07);
  color: var(--text-primary);
}
.ws-modal-btn.danger {
  color: #fca5a5;
  background: rgba(248, 113, 113, 0.12);
  border-color: rgba(248, 113, 113, 0.30);
}
.ws-modal-btn.danger:hover {
  background: rgba(248, 113, 113, 0.22);
  border-color: rgba(248, 113, 113, 0.50);
  color: #fecaca;
}
.ws-modal-btn:active { transform: scale(0.97); }

.workspace-card .card-desc {
  font-size: 13px;
  min-height: 0;
  color: var(--text-tertiary);
  -webkit-line-clamp: 1;
}
.workspace-card .ws-badge {
  color: #eab308;
  background: rgba(234, 179, 8, 0.10);
  border-color: rgba(234, 179, 8, 0.24);
}
.workspace-card .ws-actions {
  display: flex;
  gap: 8px;
  margin-top: 14px;
}
.workspace-card .ws-btn {
  flex: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 500;
  font-family: inherit;
  color: var(--text-secondary);
  padding: 7px 10px;
  border-radius: 8px;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  cursor: pointer;
  text-decoration: none;
  transition: background .15s ease, color .15s ease, border-color .15s ease, transform .1s ease;
}
.workspace-card .ws-btn svg {
  width: 13px;
  height: 13px;
  flex-shrink: 0;
}
.workspace-card .ws-btn:hover {
  background: rgba(99, 102, 241, 0.18);
  border-color: rgba(165, 180, 252, 0.40);
  color: var(--text-primary);
}
.workspace-card .ws-btn:active { transform: scale(0.97); }

.card {
  display: block;
  position: relative;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  text-decoration: none;
  color: inherit;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
  transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
  opacity: 0;
  transform: translateY(8px);
}

.card.visible {
  opacity: 1;
  transform: translateY(0);
  transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s, opacity 0.35s ease-out, transform 0.35s ease-out;
}

.card:hover {
  border-color: var(--border-hover);
  transform: translateY(-2px);
  background: var(--bg-card-hover);
}

.card:hover .card-icon {
  box-shadow: 0 0 20px var(--card-glow, rgba(99, 102, 241, 0.15));
}

/* Patch animations — removals, updates */
.card.removing,
.skill-card.removing {
  opacity: 0 !important;
  transform: scale(0.96) translateY(4px) !important;
  transition: opacity 0.35s ease-out, transform 0.35s ease-out !important;
  pointer-events: none;
}

.card.updated,
.skill-card.updated {
  animation: card-flash 0.6s ease-out;
}

.update-label {
  position: absolute;
  bottom: 8px;
  right: 10px;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: -0.01em;
  color: rgba(255,255,255,.88);
  background: linear-gradient(165deg, rgba(50,50,68,.88) 0%, rgba(32,32,46,.92) 100%);
  backdrop-filter: blur(16px) saturate(1.4);
  -webkit-backdrop-filter: blur(16px) saturate(1.4);
  border: 1px solid rgba(255,255,255,.1);
  box-shadow: 0 4px 12px -2px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.06);
  padding: 4px 10px 4px 14px;
  border-radius: 8px;
  pointer-events: none;
  z-index: 10;
  animation: update-label-in .35s cubic-bezier(.16,1,.3,1);
  transition: opacity .6s ease-out, transform .6s ease-out;
}
/* Accent dot */
.update-label::before {
  content: '';
  position: absolute;
  left: 6px;
  top: 50%;
  transform: translateY(-50%);
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: #818cf8;
}
.update-label.fade-out {
  opacity: 0;
  transform: translateY(4px);
}
@keyframes update-label-in {
  0%   { opacity: 0; transform: translateY(6px) scale(.95); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes card-flash {
  0%   { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.3); }
  40%  { box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15); }
  100% { box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2); }
}

.card-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 12px;
}

.card-icon {
  width: 48px;
  height: 48px;
  border-radius: 10px;
  background: var(--icon-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: box-shadow 0.3s;
}

.card-icon svg {
  width: 24px;
  height: 24px;
}

.card-title-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  min-width: 0;
}

.card-title {
  font-size: 18px;
  font-weight: 600;
  color: var(--text-primary);
}

.card-sessions {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  white-space: nowrap;
  color: var(--text-tertiary);
  font-weight: 500;
  opacity: 0;
  transition: opacity 0.3s;
}

.card-sessions.active {
  opacity: 1;
  color: var(--text-secondary);
}

.card-sessions .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #22c55e;
  animation: pulse-dot 2s ease-in-out infinite;
}

@keyframes pulse-dot {
  0%, 100% { opacity: 0.7; }
  50% { opacity: 1; }
}

.card-desc {
  font-size: 15px;
  font-weight: 400;
  color: var(--text-secondary);
  line-height: 1.5;
  min-height: 45px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-footer {
  margin-top: 14px;
  font-size: 13px;
  color: var(--text-tertiary);
  font-weight: 500;
  letter-spacing: 0.3px;
}

.card-type-badge {
  display: inline-block;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 1px 5px;
  border-radius: 3px;
  color: #3b82f6;
  background: rgba(59, 130, 246, 0.12);
  border: 1px solid rgba(59, 130, 246, 0.2);
  vertical-align: middle;
}

.card-badge-public {
  color: #22c55e;
  background: rgba(34, 197, 94, 0.12);
  border: 1px solid rgba(34, 197, 94, 0.2);
}

/* Public PTY: a real process fed stranger keystrokes — flag it louder than public web. */
.card-badge-public-pty {
  color: #f59e0b;
  background: rgba(245, 158, 11, 0.12);
  border: 1px solid rgba(245, 158, 11, 0.30);
  cursor: help;
}

/* Config popover */
.config-gear {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 28px;
  height: 28px;
  border-radius: 6px;
  border: none;
  background: transparent;
  color: var(--text-tertiary);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.2s, background 0.2s, color 0.2s;
  z-index: 2;
}
.card:hover .config-gear,
.skill-card:hover .config-gear {
  opacity: 1;
}
.config-gear:hover {
  background: rgba(255, 255, 255, 0.08);
  color: var(--text-secondary);
}
.config-gear svg {
  width: 16px;
  height: 16px;
}
.config-popover {
  display: none;
  position: absolute;
  top: 42px;
  right: 12px;
  z-index: 10;
  background: var(--bg-card-hover);
  border: 1px solid var(--border-hover);
  border-radius: 10px;
  padding: 14px 16px;
  min-width: 240px;
  max-width: 340px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
}
.config-popover.open { display: block; cursor: default; user-select: text; }
.card:has(.config-popover.open), .skill-card:has(.config-popover.open) { z-index: 10; }
.config-row {
  display: flex;
  gap: 8px;
  font-size: 12px;
  line-height: 1.6;
}
.config-row + .config-row { margin-top: 6px; }
.config-label {
  color: var(--text-tertiary);
  flex-shrink: 0;
  min-width: 60px;
  text-align: right;
}
.config-value {
  color: var(--text-secondary);
  font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
  word-break: break-all;
}

.config-hide-btn, .config-top-btn {
  background: none;
  border: none;
  color: var(--text-tertiary);
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  padding: 2px 0;
  transition: color 0.2s;
}
.config-hide-btn:hover { color: #f59e0b; }
.config-top-btn:hover { color: #3b82f6; }
.config-default-btn { background: none; border: none; color: var(--text-tertiary); font-size: 12px; font-family: inherit; cursor: pointer; padding: 2px 0; transition: color 0.2s; }
.config-default-btn:hover { color: #22c55e; }

/* Skeleton loading */
.skeleton-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
}

.skeleton-icon {
  width: 48px;
  height: 48px;
  border-radius: 10px;
  background: var(--icon-bg);
  margin-bottom: 16px;
}

.skeleton-line {
  height: 14px;
  border-radius: 6px;
  background: linear-gradient(90deg, var(--icon-bg) 25%, #252535 50%, var(--icon-bg) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
}

.skeleton-line.title { width: 60%; height: 16px; margin-bottom: 10px; }
.skeleton-line.desc { width: 85%; margin-bottom: 6px; }
.skeleton-line.desc2 { width: 65%; }

@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* Section labels */
.section-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-tertiary);
  margin-bottom: 16px;
  padding-left: 4px;
}

/* Skills grid — 2 columns on desktop, 1 on mobile; first card always full-width */
.skills-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(500px, 100%), 1fr));
  gap: 16px;
  padding-bottom: 40px;
}
.skills-grid > .skill-card:first-of-type { grid-column: 1 / -1; }

/* Skill card — purple-tinted border, no link behavior */
.skill-card {
  position: relative;
  background: var(--bg-card);
  border: 1px solid rgba(167, 139, 250, 0.15);
  border-radius: 12px;
  padding: 20px 24px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
  transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
  opacity: 0;
  transform: translateY(8px);
}
.skill-card.visible {
  opacity: 1;
  transform: translateY(0);
  transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s,
              opacity 0.35s ease-out, transform 0.35s ease-out;
}
.skill-card:hover {
  border-color: rgba(167, 139, 250, 0.35);
  box-shadow: 0 0 30px rgba(167, 139, 250, 0.06);
}

/* Directory-scoped agent card (slashPrefix: false) — blue-purple accent */
.skill-card.project-card { border-color: rgba(124, 154, 239, 0.15); }
.skill-card.project-card:hover { border-color: rgba(124, 154, 239, 0.35); box-shadow: 0 0 30px rgba(124, 154, 239, 0.06); }
.skill-card.project-card .skill-input:focus { border-color: rgba(124, 154, 239, 0.5); box-shadow: 0 0 0 3px rgba(124, 154, 239, 0.08); }
.skill-card.project-card .skill-submit.has-input { color: #7c9aef; }
.skill-card.project-card .skill-submit:hover,
.skill-card.project-card .skill-submit.has-input:hover { background: rgba(124, 154, 239, 0.15); color: #7c9aef; }
.skill-card.project-card .skill-newtab { background: rgba(124, 154, 239, 0.08); color: #7c9aef; }
.skill-card.project-card:hover .skill-newtab { color: #7c9aef; }
.skill-card.project-card .skill-newtab:hover { background: rgba(124, 154, 239, 0.2); color: #9db8f5; }
.project-badge {
  display: inline-block;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 1px 5px;
  border-radius: 3px;
  color: #7c9aef;
  background: rgba(124, 154, 239, 0.12);
  border: 1px solid rgba(124, 154, 239, 0.2);
  vertical-align: middle;
}
.project-path {
  font-size: 11px;
  color: var(--text-tertiary);
  margin-top: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-family: 'SF Mono', 'Fira Code', 'Fira Mono', 'Roboto Mono', monospace;
  opacity: 0.7;
}

/* Skill card header — icon + title + desc */
.skill-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 16px;
}
.skill-info { min-width: 0; }
.skill-info .card-title { font-size: 16px; }
.skill-desc {
  font-size: 13px;
  color: var(--text-secondary);
  margin-top: 5px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* Inline input form */
.skill-form {
  display: flex;
  flex-direction: column;
}
.skill-input-wrap {
  position: relative;
  display: flex;
  align-items: flex-end;
}
.skill-input {
  flex: 1;
  background: rgba(0, 0, 0, 0.15);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 40px 10px 14px;
  color: var(--text-primary);
  font-size: 15px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  resize: none;
  overflow: hidden;
  min-height: 40px;
  max-height: 320px;
  line-height: 1.5;
  field-sizing: content;
}
.skill-input.tip-fading::placeholder { opacity: 0; transition: opacity 0.3s ease; }
.skill-input::placeholder { transition: opacity 0.3s ease; }
.skill-input:focus {
  border-color: rgba(167, 139, 250, 0.5);
  box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.08);
}
.skill-input::placeholder {
  color: var(--text-tertiary);
}
.skill-input::-webkit-scrollbar {
  width: 6px;
}
.skill-input::-webkit-scrollbar-track {
  background: transparent;
}
.skill-input::-webkit-scrollbar-thumb {
  background: var(--border-hover);
  border-radius: 3px;
}
.skill-input::-webkit-scrollbar-thumb:hover {
  background: var(--text-tertiary);
}
.skill-input {
  scrollbar-width: thin;
  scrollbar-color: var(--border-hover) transparent;
}
.skill-submit {
  position: absolute;
  right: 6px;
  bottom: 6px;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  border-radius: 6px;
  color: var(--text-tertiary);
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  padding: 0;
}
.skill-submit.has-input {
  color: #a78bfa;
}
.skill-submit:hover,
.skill-submit.has-input:hover {
  background: rgba(167, 139, 250, 0.15);
  color: #a78bfa;
}
.skill-submit svg {
  width: 16px;
  height: 16px;
}
.skill-newtab {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  height: 28px;
  background: rgba(167, 139, 250, 0.08);
  border: none;
  border-radius: 6px;
  color: #a78bfa;
  cursor: pointer;
  transition: background 0.15s, color 0.15s, opacity 0.15s;
  padding: 0 8px 0 6px;
  vertical-align: middle;
  margin-left: 6px;
  opacity: 0.85;
}
.skill-newtab-label {
  font-size: 12px;
  font-weight: 500;
  line-height: 1;
}
.skill-card:hover .skill-newtab {
  opacity: 1;
  color: #a78bfa;
}
.skill-newtab:hover {
  background: rgba(167, 139, 250, 0.2);
  color: #c4b5fd;
  opacity: 1;
}
.skill-newtab svg {
  width: 16px;
  height: 16px;
}
.skill-form-footer {
  display: flex;
  align-items: center;
  margin-top: 6px;
}
.skill-hint {
  font-size: 11px;
  color: var(--text-tertiary);
  opacity: 0;
  transition: opacity 0.2s;
  user-select: none;
}
.skill-hint kbd {
  display: inline-block;
  padding: 1px 5px;
  font-size: 10px;
  font-family: inherit;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text-secondary);
}
.skill-hint kbd + kbd {
  margin-left: 2px;
}
.skill-input:focus ~ .skill-submit ~ .skill-form-footer .skill-hint,
.skill-card:hover .skill-hint {
  opacity: 1;
}
.skill-input:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.skill-inline-wrap {
  margin: 12px -24px -20px;
}
.skill-inline-wrap .mt-bar {
  border-left: none;
  border-right: none;
  border-radius: 0;
}
.skill-inline-wrap .mt-bar.collapsed {
  border-radius: 0 0 12px 12px;
}
.skill-inline-wrap .mt-term {
  border-left: none;
  border-right: none;
  border-bottom: none;
  border-radius: 0 0 12px 12px;
}

/* Error / Empty */
.message {
  text-align: center;
  padding: 80px 24px;
  color: var(--text-secondary);
  font-size: 15px;
  /* Messages that explain how to recover need paragraphs; without this their
     line breaks collapse and the instructions run together. */
  white-space: pre-line;
  /* The containers these land in are grids, so without spanning the row a
     message is placed in one 280px column and reads as a narrow ragged
     stripe on the left rather than centred text. */
  grid-column: 1 / -1;
  max-width: 52ch;
  margin: 0 auto;
}

.message.error { color: #ef4444; }


/* ── Narrow layout (≤640px) ── */
html.narrow header { padding: 14px 0; gap: 0; flex-wrap: wrap; }
html.narrow .header-left { flex: 1; }
html.narrow .tagline { display: none; }
html.narrow .header-right { flex-shrink: 0; }
html.narrow .container { padding: 0 16px; }
html.narrow .grid { gap: 12px; }
html.narrow .skills-grid { grid-template-columns: 1fr; margin: 0 -16px; padding: 0 0 24px; gap: 10px; }
html.narrow .skill-card { border-radius: 0; }
html.narrow .skill-inline-wrap .mt-bar { border-radius: 0; }
html.narrow .skill-inline-wrap .mt-bar.collapsed { border-radius: 0; }
html.narrow .skill-inline-wrap .mt-term { border-radius: 0; }
html.narrow .skill-hint { display: none !important; }
html.narrow .wordmark { font-size: 20px; }
html.narrow .card { padding: 14px 16px; overflow: visible; }
html.narrow .card-title { font-size: 14px; }
html.narrow .card-desc { font-size: 12px; -webkit-line-clamp: 1; margin-top: 2px; min-height: 0; }
html.narrow .card-footer { display: none; }
html.narrow .card-icon { width: 36px; height: 36px; border-radius: 8px; }
html.narrow .card-icon svg { width: 18px; height: 18px; }
html.narrow .card-header { gap: 10px; margin-bottom: 4px; }
html.narrow .skill-info .card-title { font-size: 14px; }
html.narrow .skill-desc { font-size: 12px; }
html.narrow .skill-input { font-size: 16px; padding: 10px 44px 10px 14px; }
html.narrow .skill-submit { width: 36px; height: 36px; right: 4px; bottom: 4px; }
html.narrow .skill-submit svg { width: 18px; height: 18px; }
html.narrow .search-input { font-size: 16px; }
html.narrow .section-label { font-size: 10px; }
html.narrow .config-popover { min-width: 0; max-width: none; left: 12px; right: 12px; }
html.narrow .config-gear { display: none; }
html.narrow .search-wrapper {
  order: 3;
  flex-basis: 100%;
  max-width: none;
  margin-top: 10px;
}
html.narrow .search-wrapper svg { left: 12px; }
html.narrow .ws-kebab { width: 32px; height: 32px; top: 8px; right: 8px; }
html.narrow .ws-actions { gap: 6px; margin-top: 10px; padding-top: 0; }
html.narrow .ws-btn { padding: 8px 8px; }
html.narrow .ws-btn svg { width: 14px; height: 14px; }
html.narrow .card-title.editing { font-size: 16px; }
html.narrow .ws-menu { min-width: 220px; }
html.narrow .ws-modal { padding: 18px 18px 14px; border-radius: 12px; }
html.narrow .ws-modal-title { font-size: 14px; }
html.narrow .ws-modal-body { font-size: 12px; }

/* ── Touch interaction ── */
html.touch .config-gear { opacity: 0.5; width: 44px; height: 44px; top: 6px; right: 6px; }
html.touch .card:active { transform: scale(0.98); background: var(--bg-card-hover); transition: none; }
html.touch .skill-card:active { transform: scale(0.99); background: var(--bg-card-hover); transition: none; }
html.touch .skill-submit { width: 44px; height: 44px; right: 2px; bottom: 2px; }
html.touch .skill-newtab { height: 32px; padding: 0 10px 0 8px; opacity: 0.85; }
html.touch .workspace-card { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
html.touch .ws-kebab {
  opacity: 0.6;
  width: 40px;
  height: 40px;
  top: 6px;
  right: 6px;
  color: var(--text-secondary);
}
html.touch .ws-kebab svg { width: 18px; height: 18px; }
html.touch .ws-kebab:active, html.touch .ws-kebab.active {
  opacity: 1;
  background: rgba(255,255,255,0.08);
  color: var(--text-primary);
}
html.touch .ws-btn { padding: 9px 10px; min-height: 36px; }
html.touch .ws-menu { padding: 8px; }
html.touch .ws-menu-item { padding: 11px 14px 11px 12px; font-size: 14px; gap: 12px; }
html.touch .ws-menu-item svg { width: 16px; height: 16px; }
html.touch .ws-modal-btn { padding: 10px 18px; font-size: 14px; min-height: 40px; }
html.touch .skill-newtab svg { width: 16px; height: 16px; }

/* ── Swipe cards base (always present, actions hidden until narrow+touch) ── */
.card-swipe-wrap {
  position: relative;
  display: flex;
  flex-direction: column;
}
.card-swipe-wrap > .card {
  flex: 1;
}
.card-actions {
  display: none;
}

/* ── Narrow + Touch: swipe cards ── */
html.narrow.touch .card-swipe-wrap {
  overflow: hidden;
  border-radius: 12px;
}
html.narrow.touch .card-swipe-wrap .card {
  position: relative;
  z-index: 1;
  transition: transform 0.25s ease;
  border-radius: 12px;
}
html.narrow.touch .card-actions {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  display: flex;
  align-items: stretch;
  z-index: 0;
}
html.narrow.touch .card-action-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 72px;
  border: none;
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  cursor: pointer;
  flex-direction: column;
  gap: 4px;
}
html.narrow.touch .card-action-btn svg { width: 18px; height: 18px; }
html.narrow.touch .card-action-btn.action-info { background: #333342; color: var(--text-secondary); }
html.narrow.touch .card-action-btn.action-hide { background: #332b1a; color: #f59e0b; }
</style>
</head>
<body>
<script src="viewport.js"></script>
<div class="container">
  <header>
    <div class="header-left">
      <a href="/" class="wordmark">{{title}}</a>
      <div class="tagline">{{tagline}}</div>
    </div>
    <div class="search-wrapper">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="search-input" id="catalog-search" type="text" placeholder="Search..." autocomplete="off" spellcheck="false">
    </div>
    <div class="header-right">
      <div class="header-counts" id="header-counts"></div>
      <div class="header-sessions" id="header-sessions"></div>
    </div>
  </header>
  <div id="skills-section" hidden>
    <div class="section-label">Agent Cards</div>
    <div id="skills-content" class="skills-grid"></div>
  </div>
  <div id="apps-section" hidden>
    <div class="section-label">Apps</div>
    <div id="apps-content" class="grid"></div>
  </div>
  <div id="workspace-section" hidden>
    <div class="section-label">Workspace</div>
    <div id="workspace-content" class="grid"></div>
  </div>
  <div id="search-empty" class="message" hidden>No results</div>
  <div id="loading-content" class="grid">
    <div class="skeleton-card"><div class="skeleton-icon"></div><div class="skeleton-line title"></div><div class="skeleton-line desc"></div><div class="skeleton-line desc2"></div></div>
    <div class="skeleton-card"><div class="skeleton-icon"></div><div class="skeleton-line title"></div><div class="skeleton-line desc"></div><div class="skeleton-line desc2"></div></div>
    <div class="skeleton-card"><div class="skeleton-icon"></div><div class="skeleton-line title"></div><div class="skeleton-line desc"></div><div class="skeleton-line desc2"></div></div>
  </div>
</div>
<script src="icons.js"></script>
<script type="module">
import './api.js';
import { connectRpc } from './wsh-rpc.js';
import { wrapCard as swipeWrapCard, init as swipeInit } from './swipe-cards.js';

(function() {
  // Track active inline terminals per app key
  var inlineTerminals = {};

  // Use shared icon registry from icons.js
  var iconColors = window.wshIconColors;
  var icons = window.wshIcons;
  var iconAliases = window.wshIconAliases;

  // Auto-generated descriptions for well-known apps
  var defaultDescriptions = {
    bash: 'Bourne Again Shell',
    zsh: 'Z Shell',
    sh: 'POSIX Shell',
    fish: 'Friendly Interactive Shell',
    python: 'Python REPL',
    python3: 'Python 3 REPL',
    node: 'Node.js REPL',
    nodejs: 'Node.js REPL',
    vim: 'Vi IMproved text editor',
    nvim: 'Neovim text editor',
    neovim: 'Neovim text editor',
    htop: 'Interactive process viewer',
    btop: 'Resource monitor',
    top: 'Process monitor',
    docker: 'Container runtime',
    git: 'Version control',
    ruby: 'Ruby REPL',
    irb: 'Interactive Ruby',
    claude: 'AI coding assistant',
    chatgpt: 'AI assistant',
    ollama: 'Local AI models',
    aider: 'AI pair programming',
    mysql: 'MySQL client',
    psql: 'PostgreSQL client',
    'redis-cli': 'Redis client',
    sqlite3: 'SQLite console',
    ssh: 'Secure Shell',
    curl: 'HTTP client',
    wget: 'File downloader'
  };

  function resolveIconId(app) {
    if (app.icon && icons[app.icon]) return app.icon;
    if (iconAliases[app.key]) return iconAliases[app.key];
    var basename = app.command.split('/').pop();
    if (iconAliases[basename]) return iconAliases[basename];
    return 'default';
  }

  function resolveDescription(app) {
    if (app.description) return app.description;
    if (defaultDescriptions[app.key]) return defaultDescriptions[app.key];
    var basename = app.command.split('/').pop();
    if (defaultDescriptions[basename]) return defaultDescriptions[basename];
    if (app.skill) return 'Skill';
    if (app.type === 'web') return 'Web app';
    return 'Terminal app';
  }

  function buildSkillCard(app, isHidden) {
    var iconId = resolveIconId(app);
    var color = iconColors[iconId] || iconColors.default;
    var div = document.createElement('div');
    var isTopped = !isHidden && !!app.top;
    div.className = 'skill-card' + (app.slashPrefix === false ? ' project-card' : '') + (isTopped ? ' topped-app' : '');
    if (isHidden) div.style.display = 'none';
    div.dataset.app = app.key;
    div.dataset.title = app.title;
    div.dataset.desc = resolveDescription(app);
    if (app.slashPrefix === false) div.dataset.slashPrefix = '0';
    if (isHidden) div.dataset.hidden = '1';
    if (isTopped) div.dataset.top = '1';
    var isProject = app.slashPrefix === false;
    var tips = app.tips && app.tips.length ? app.tips : null;
    var startIdx = tips ? Math.floor(Math.random() * tips.length) : 0;
    var placeholder = tips ? tips[startIdx] : (isProject ? 'What would you like to do?' : 'Describe your task...');
    var badges = isProject
      ? '<span class="project-badge">Project</span>' + (isTopped ? ' <span class="top-badge">Top</span>' : '')
      : (isTopped ? '<span class="top-badge">Top</span>' : '');
    div.innerHTML =
      buildConfigPopover(app) +
      '<div class="skill-header">' +
        '<div class="card-icon" style="color:' + (app.slashPrefix === false ? '#7c9aef' : '#a78bfa') + '">' + icons[iconId] + '</div>' +
        '<div class="skill-info">' +
          '<span class="card-title">' + escapeHtml(app.title) + '</span> ' +
          badges +

  var tipCycleTimer = null;

  function stopTipCycling() {
    if (tipCycleTimer) { clearInterval(tipCycleTimer); tipCycleTimer = null; }
  }

  function startTipCycling(container) {
    stopTipCycling();
    var textareas = Array.from(container.querySelectorAll('textarea.skill-input[data-tips]')).filter(function(ta) {
      try { return JSON.parse(ta.dataset.tips).length >= 2; } catch(e) { return false; }
    });
    if (!textareas.length) return;
    tipCycleTimer = setInterval(function() {
      textareas.forEach(function(ta) {
        if (ta.value !== '' || document.activeElement === ta) return;
        var tips = JSON.parse(ta.dataset.tips);
        var curIdx = parseInt(ta.dataset.tipIdx, 10) || 0;
        var tipIdx = (curIdx + 1 + Math.floor(Math.random() * (tips.length - 1))) % tips.length;
        ta.classList.add('tip-fading');
        setTimeout(function() {
          ta.dataset.tipIdx = tipIdx;
          ta.placeholder = tips[tipIdx];
          ta.classList.remove('tip-fading');
        }, 300);
      });
    }, 18000);
  }

  function renderSkills(skills, hiddenSkills) {
    var section = document.getElementById('skills-section');
    var content = document.getElementById('skills-content');
    stopTipCycling();
    content.innerHTML = '';
    skills.forEach(function(app, i) {
      var div = buildSkillCard(app, false);
      content.appendChild(div);
      setTimeout(function() { div.classList.add('visible'); }, 30 * i);
    });
    (hiddenSkills || []).forEach(function(app, i) {
      var div = buildSkillCard(app, true);
      content.appendChild(div);
      setTimeout(function() { div.classList.add('visible'); }, 30 * (skills.length + i));
    });
    section.hidden = false;
    startTipCycling(content);
  }

  function buildAppCard(app, isHidden) {

    var a = document.createElement('a');
    a.href = './' + app.key;
    var isTopped = !isHidden && !!app.top;

    a.dataset.app = app.key;
    a.dataset.title = app.title;

    if (isTopped) a.dataset.top = '1';

    a.style.setProperty('--card-glow', 'rgba(' + r + ',' + g + ',' + b + ',0.2)');

      (app.default ? ' <span class="default-badge" title="Opens by default — the catalog auto-redirects here">Default</span>' : '');

        '<div class="card-title-row">' +

  function renderCards(allApps) {
    document.getElementById('loading-content').hidden = true;

      appsSection.querySelector('.section-label').style.display = 'none';

    }
    var visibleApps = allApps.filter(function(a) { return !a.hidden; });
    var hiddenApps = allApps.filter(function(a) { return !!a.hidden; });
    var skills = visibleApps.filter(function(a) { return !!a.skill; });
    var apps = visibleApps.filter(function(a) { return !a.skill; });
    var hiddenSkills = hiddenApps.filter(function(a) { return !!a.skill; });
    var hiddenNonSkills = hiddenApps.filter(function(a) { return !a.skill; });
    if (skills.length || hiddenSkills.length) {
      renderSkills(skills, hiddenSkills); restoreDrafts(); reconnectInline();
    }
    if (apps.length || hiddenNonSkills.length) renderApps(apps, hiddenNonSkills);

    if (searchInput && !document.documentElement.classList.contains('narrow') && !document.documentElement.classList.contains('touch')) searchInput.focus();

  function initSearch(allApps) {
    var input = document.getElementById('catalog-search');
    if (!input) return;

    function filterCards(selector) {
      var q = input.value.toLowerCase().trim();
      var cards = document.querySelectorAll(selector);
      var visible = 0;
      for (var i = 0; i < cards.length; i++) {
        var card = cards[i];
        // On mobile, app cards are wrapped — check the wrap for hidden/data attrs
        var wrap = card.closest('.card-swipe-wrap');
        var target = wrap || card;
        var isHidden = target.dataset.hidden === '1';
        var title = (target.getAttribute('data-title') || card.getAttribute('data-title') || '').toLowerCase();
        var desc = (target.getAttribute('data-desc') || card.getAttribute('data-desc') || '').toLowerCase();
        var appKey = (target.getAttribute('data-app') || card.getAttribute('data-app') || '').toLowerCase();
        var matchesQuery = title.indexOf(q) !== -1 || desc.indexOf(q) !== -1 || appKey.indexOf(q) !== -1;
        var show = isHidden ? ((showingHidden || q) && matchesQuery) : (!q || matchesQuery);
        target.style.display = show ? '' : 'none';
        if (show) visible++;
      }
      return visible;
    }

    input.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && input.value) {
        e.preventDefault();
        e.stopPropagation();
        input.value = '';
        input.dispatchEvent(new Event('input'));
      }
    });

    input.addEventListener('input', function() {
      var skillsVisible = filterCards('#skills-content .skill-card');
      var appsVisible = filterCards('#apps-content .card');
      var skillsSection = document.getElementById('skills-section');
      var appsSection = document.getElementById('apps-section');
      if (skillsSection && !skillsSection.hidden) {
        skillsSection.style.display = skillsVisible ? '' : 'none';
      }
      if (appsSection && !appsSection.hidden) {
        appsSection.style.display = appsVisible ? '' : 'none';
      }
      var emptyEl = document.getElementById('search-empty');
      if (emptyEl) {
        var q = input.value.trim();
        emptyEl.hidden = !q || skillsVisible || appsVisible;
      }
    });
  }

  // ── Centralized hide/unhide ──────────────────────────────
  // Every code path that hides or unhides a card MUST go through these two
  // functions.  They own all DOM mutations, popover state, and header updates.

  function hideCard(card, appKey) {
    var target = card.closest('.card-swipe-wrap') || card;
    card.dataset.hidden = '1';
    if (target !== card) target.dataset.hidden = '1';
    setPopoverHidden(card, appKey, true);
    // Expanded, the grid is showing hidden apps on purpose, so a card that
    // just became one belongs where it already is. Collapsed, hiding is a
    // removal from what you see, and reads as one.
    if (showingHidden) { updateCounts(); return; }
    card.classList.add('removing');
    setTimeout(function() {
      target.style.display = 'none';
      card.classList.remove('removing');
      updateCounts();
    }, 350);
  }

  function unhideCard(card) {
    var target = card.closest('.card-swipe-wrap') || card;
    delete card.dataset.hidden;
    if (target !== card) delete target.dataset.hidden;
    setPopoverHidden(card, card.dataset.app, false);
    card.classList.remove('visible');
    target.style.display = '';
    requestAnimationFrame(function() { card.classList.add('visible'); });
    updateCounts();
  }

  /** Flip the gear popover's Hide/Unhide button. Hidden cards are drawn at
   *  full strength with no badge, so this button is the only place a card
   *  says which side of the boundary it is on. */
  function setPopoverHidden(card, appKey, isHidden) {
    var btn = card.querySelector('.config-hide-btn');
    if (!btn) return;
    var key = appKey || card.dataset.app || '';
    btn.textContent = isHidden ? 'Unhide' : 'Hide';
    btn.removeAttribute(isHidden ? 'data-hide-app' : 'data-unhide-app');
    btn.setAttribute(isHidden ? 'data-unhide-app' : 'data-hide-app', key);
  }

  // ── "All apps" expander ──────────────────────────────────
  // One control, two sections: the card sits in APPS, but the run it opens is
  // every hidden card on the page, skills included — a hidden agent card
  // with no control of its own would otherwise be unreachable.
  var showingHidden = false;

  var gridSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>';

  function buildMoreCard(total) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'card more-card visible';
    btn.setAttribute('aria-expanded', showingHidden ? 'true' : 'false');
    btn.innerHTML =
      '<span class="more-icon">' + (showingHidden ? chevronUpSvg : gridSvg) + '</span>' +
      '<span class="more-label">' + (showingHidden ? 'Show fewer' : 'All apps') + '</span>' +

  /** Place the expander: always the last card in the grid. Collapsed that is
   *  the end of the run of shown apps; expanded it is the end of everything,
   *  which is also where you are once you have scrolled the expansion. It
   *  moves rather than duplicating — a second card reading "Show fewer" says
   *  the same thing twice. Rebuilt rather than patched, because hide, unhide,
   *  add and remove all move the boundary it sits on. */
  function syncMoreCards() {
    var content = document.getElementById('apps-content');
    if (!content) return;
    var stale = content.querySelectorAll('.more-card');
    for (var i = 0; i < stale.length; i++) stale[i].remove();
    var total = hiddenTargets().length;
    if (!total) { showingHidden = false; return; }
    // Unhiding leaves a card sitting among the hidden ones; re-partition so
    // the shown apps stay one contiguous run ahead of the expander. The split
    // is stable, so the server's own ordering survives inside each group.
    var shown = [], hid = [], kids = Array.prototype.slice.call(content.children);
    for (var j = 0; j < kids.length; j++) {
      (kids[j].dataset.hidden === '1' ? hid : shown).push(kids[j]);
    }
    shown.concat(hid).forEach(function(el) { content.appendChild(el); });
    var card = buildMoreCard(total);
    if (showingHidden || !hid.length) content.appendChild(card);
    else content.insertBefore(card, hid[0]);
  }

  function setShowingHidden(on) {
    showingHidden = on;
    var cards = hiddenTargets();
    for (var i = 0; i < cards.length; i++) cards[i].style.display = on ? '' : 'none';
    updateCounts();
  }

  document.addEventListener('click', function(e) {
    if (!e.target.closest('.more-card')) return;
    e.preventDefault();
    setShowingHidden(!showingHidden);
  });

  function updateCounts() {
    var appsCount = document.querySelectorAll('#apps-content > .card-swipe-wrap:not([data-hidden="1"])').length;
    var skillsCount = document.querySelectorAll('#skills-content > .skill-card:not([data-hidden="1"])').length;
    var countsEl = document.getElementById('header-counts');
    if (countsEl) {
      var parts = [];
      if (appsCount) parts.push(appsCount + (appsCount === 1 ? ' app' : ' apps'));
      if (skillsCount) parts.push(skillsCount + (skillsCount === 1 ? ' skill' : ' skills'));
      countsEl.innerHTML = parts.join(' · ');
    }
    syncMoreCards();
    // APPS keeps its place even with nothing shown in it: the expander card
    // lives there, and hiding the section would strand every hidden app.
    var ss = document.getElementById('skills-section');
    var as = document.getElementById('apps-section');
    var hasMore = !!document.querySelector('#apps-content > .more-card');
    if (ss && !ss.hidden) ss.style.display = (showingHidden || skillsCount) ? '' : 'none';
    if (as && !as.hidden) as.style.display = (showingHidden || appsCount || hasMore) ? '' : 'none';

  // Listen for swipe-hide events from swipe-cards.js
  document.addEventListener('app-hidden', function(e) {
    var appKey = e.detail && e.detail.appKey;
    if (!appKey) return;

  function fetchSessions() {
    fetch('./api/sessions')
      .then(function(res) { return res.ok ? res.json() : null; })
      .then(function(data) {
        if (!data || !data.sessions) return;
        // Count sessions per app
        var counts = {};
        data.sessions.forEach(function(s) {
          var app = s.app || 'bash';
          counts[app] = (counts[app] || 0) + 1;
        });
        // Update card badges
        var badges = document.querySelectorAll('.card-sessions[data-app]');
        for (var i = 0; i < badges.length; i++) {
          var badge = badges[i];
          var appKey = badge.getAttribute('data-app');
          var count = counts[appKey];
          if (count) {
            badge.innerHTML = '<span class="dot"></span>' + count + ' active';
            badge.classList.add('active');
          }
        }
        // Update header session count
        var total = data.sessions.length;
        var headerSessions = document.getElementById('header-sessions');
        if (headerSessions && total > 0) {
          headerSessions.innerHTML = '<span class="dot"></span>' + total + ' active ' + (total === 1 ? 'session' : 'sessions');
        }
      })
      .catch(function() {}); // silently ignore — sessions are non-critical
  }

  function escapeHtml(s) {

  var skillPopoverFields = { skill: 1, agent: 1, cwd: 1, icon: 1, hidden: 1, top: 1 };

  function buildConfigPopover(app) {
    var html = '';

    var config = app._raw || app;
    Object.keys(config).forEach(function(k) {
      if (k === '_raw' || k === 'description' || k === 'title') return;

      : '';

  // notice=true renders in the normal text colour instead of red. "You need a
  // token" is an instruction, not a fault, and alarming someone whose only
  // mistake was opening the bare URL is the wrong first impression.
  function showError(msg, notice) {
    document.getElementById('loading-content').hidden = true;
    var appsSection = document.getElementById('apps-section');
    appsSection.hidden = false;
    appsSection.querySelector('.section-label').style.display = 'none';

  // Reconnect inline terminals from localStorage on page reload
  function reconnectInline() {
    document.querySelectorAll('.skill-card[data-app]').forEach(function(card) {
      var appKey = card.dataset.app;
      var saved = localStorage.getItem('wsh-inline:' + appKey);
      if (!saved) return;
      try {
        var info = JSON.parse(saved);
        var wrap = card.querySelector('.skill-inline-wrap');
        var handle = MiniTerminal.create(wrap, info.id, info.url, true);
        inlineTerminals[appKey] = handle;
      } catch { localStorage.removeItem('wsh-inline:' + appKey); }
    });
  }

  // Previous app list for diffing
  var lastApps = null;

  /** Find the single-app difference between old and new lists.
   *  Returns { type, key, app } or null if >1 app changed. */
  function diffApps(oldApps, newApps) {
    var oldByKey = {};
    oldApps.forEach(function(a) { oldByKey[a.key] = a; });
    var newByKey = {};
    newApps.forEach(function(a) { newByKey[a.key] = a; });

    var changes = [];

    // Added or changed
    newApps.forEach(function(a) {
      var old = oldByKey[a.key];
      if (!old) { changes.push({ type: 'added', key: a.key, app: a }); }
      else if (old.hidden && !a.hidden) { changes.push({ type: 'unhide', key: a.key, app: a }); }
      else if (!old.hidden && a.hidden) { changes.push({ type: 'hide', key: a.key, app: a }); }
      else {
        var fields = [];
        if (old.title !== a.title) fields.push('title');
        if (old.description !== a.description) fields.push('description');
        if (old.icon !== a.icon) fields.push('icon');
        if (old.command !== a.command) fields.push('command');
        if (old.skill !== a.skill) fields.push('skill');
        if (old.type !== a.type) fields.push('type');
        if (old.access !== a.access) fields.push('access');
        if (old.top !== a.top) fields.push('top');
        if (old.default !== a.default) fields.push('default');
        if (fields.length) changes.push({ type: 'updated', key: a.key, app: a, fields: fields });
      }
    });
    // Removed
    oldApps.forEach(function(a) {
      if (!newByKey[a.key]) changes.push({ type: 'removed', key: a.key, app: a });
    });

    if (changes.length === 0) {
      // Check order changed
      if (oldApps.length !== newApps.length) return null;
      for (var i = 0; i < oldApps.length; i++) {
        if (oldApps[i].key !== newApps[i].key) return null;
      }
      return 'none';
    }
    return changes.length === 1 ? changes[0] : null;
  }

  /** Find a card element by app key in skills or apps grids. */
  function findCard(key) {
    return document.querySelector('#skills-content > .skill-card[data-app="' + CSS.escape(key) + '"]') ||
           document.querySelector('#apps-content > .card[data-app="' + CSS.escape(key) + '"]') ||
           document.querySelector('#apps-content > .card-swipe-wrap > .card[data-app="' + CSS.escape(key) + '"]');
  }

  /** Animate a card removal: fade out in-place, then remove from DOM. */
  function animateRemove(card) {
    var target = card.closest('.card-swipe-wrap') || card;
    var rect = target.getBoundingClientRect();
    target.style.position = 'fixed';
    target.style.left = rect.left + 'px';
    target.style.top = rect.top + 'px';
    target.style.width = rect.width + 'px';
    target.style.height = rect.height + 'px';
    target.style.margin = '0';
    target.style.zIndex = '0';
    document.body.appendChild(target);
    card.classList.add('removing');
    function cleanup() { if (target.parentNode) target.remove(); }
    card.addEventListener('transitionend', function handler() {
      card.removeEventListener('transitionend', handler);
      cleanup();
    });
    setTimeout(cleanup, 400);
  }

  /** Insert a new card into the correct grid and animate it in. */
  function animateAdd(app) {
    var container, card;
    if (app.skill) {
      container = document.getElementById('skills-content');
      card = buildSkillCard(app, !!app.hidden);
      document.getElementById('skills-section').hidden = false;
    } else {
      container = document.getElementById('apps-content');
      card = buildAppCard(app, !!app.hidden);
      card = swipeWrapCard(card, app, escapeAttr);
      document.getElementById('apps-section').hidden = false;
    }
    container.appendChild(card);
    if (!app.skill) swipeInit();
    // The .card/.skill-card element (may be inside a swipe wrapper)
    var animTarget = card.classList.contains('card') || card.classList.contains('skill-card')
      ? card : card.querySelector('.card, .skill-card') || card;
    requestAnimationFrame(function() { animTarget.classList.add('visible'); });
  }

  window.refreshCatalog = function refreshCatalog() {
    return fetch('./api/apps')
      .then(function(res) {
        // A 401 here means no access token, not a broken server. Only standalone
        // mode can reach this: behind --trust-proxy, GET api/apps is exempt and
        // serves a filtered catalog. So say how to get in rather than what went
        // wrong — "Authentication required" left people with nowhere to go.
        if (res.status === 401) {
          var e = new Error(
            'This box needs its access token.\n\n' +
            'Run  wsh token  on the machine running this server, then open this ' +
            'page with  ?token=<token>  appended. The token is remembered ' +
            'afterwards, so you only do this once.'
          );
          e.notice = true;
          throw e;
        }
        if (!res.ok) throw new Error('Failed to load apps (HTTP ' + res.status + ')');
        return res.json();
      })
      .then(function(data) {
        var apps = data.apps || [];

        // Show config warnings once per session
        if (data.warnings && data.warnings.length) {
          var warnKey = 'wsh_config_warnings_' + JSON.stringify(data.warnings);
          var warnTs = parseInt(localStorage.getItem(warnKey) || '0', 10);
          if (!warnTs || Date.now() - warnTs > 86400000) {
            localStorage.setItem(warnKey, String(Date.now()));
            data.warnings.forEach(function(w) { api.toast({ html: w, variant: 'warn', duration: 10000 }); });
          }
        }

        // Initial load — full render
        if (!lastApps) {
          lastApps = apps;
          renderCards(apps);
          return;
        }

        // Diff against previous
        var diff = diffApps(lastApps, apps);
        lastApps = apps;

        // No changes — just refresh session badges
        if (diff === 'none') {
          fetchSessions();
          return;
        }
        // Multiple changes — full re-render
        if (!diff) {
          renderCards(apps);
          return;
        }

        var card = findCard(diff.key);

        if (diff.type === 'removed') {
          if (card && !inlineTerminals[diff.key]) animateRemove(card);
          updateCounts();

        } else if (diff.type === 'added') {
          animateAdd(diff.app);
          updateCounts();

        } else if (diff.type === 'hide') {
          if (card) hideCard(card, diff.key);
          else updateCounts();

        } else if (diff.type === 'unhide') {
          if (card) unhideCard(card);
          else updateCounts();

        } else if (diff.type === 'updated') {
          if (card && !inlineTerminals[diff.key]) {
            // Replace the card entirely and flash it
            var container = card.closest('#skills-content, #apps-content');
            var newCard;
            if (diff.app.skill) {
              newCard = buildSkillCard(diff.app, !!diff.app.hidden);
            } else {
              newCard = buildAppCard(diff.app, !!diff.app.hidden);
              newCard = swipeWrapCard(newCard, diff.app, escapeAttr);
            }
            var target = card.closest('.card-swipe-wrap') || card;
            container.replaceChild(newCard, target);
            var animTarget = newCard.classList.contains('card') || newCard.classList.contains('skill-card')
              ? newCard : newCard.querySelector('.card, .skill-card') || newCard;
            animTarget.classList.add('visible', 'updated');
            // Show a brief label indicating what changed
            if (diff.fields && diff.fields.length) {
              var label = document.createElement('div');
              label.className = 'update-label';
              label.textContent = diff.fields.join(', ') + ' updated';
              animTarget.style.position = 'relative';
              animTarget.appendChild(label);
              setTimeout(function() { label.classList.add('fade-out'); }, 1500);
              setTimeout(function() { if (label.parentNode) label.remove(); }, 2500);
            }
            if (!diff.app.skill) swipeInit();
          }
        }

        fetchSessions();
      })
      .catch(function(err) {
        showError(err.message, err.notice);
      });
  };
  window.refreshCatalog();

  function relativeTime(ms) {
    if (!ms) return '';
    var diff = Math.max(0, Date.now() - ms);
    var s = Math.floor(diff / 1000);
    if (s < 60) return 'just now';
    var m = Math.floor(s / 60);
    if (m < 60) return m + 'm ago';
    var h = Math.floor(m / 60);
    if (h < 24) return h + 'h ago';
    var d = Math.floor(h / 24);
    if (d < 7) return d + 'd ago';
    var w = Math.floor(d / 7);
    if (w < 5) return w + 'w ago';
    var mo = Math.floor(d / 30);
    if (mo < 12) return mo + 'mo ago';
    return Math.floor(d / 365) + 'y ago';
  }

  function buildNewWorkspaceTile() {
    var tile = document.createElement('div');
    tile.className = 'ws-new-card';
    tile.tabIndex = 0;
    tile.setAttribute('role', 'button');
    tile.setAttribute('aria-label', 'Create new folder');
    tile.innerHTML =
      '<div class="ws-new-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div>' +
      '<div class="ws-new-label">New folder</div>' +
      '<input class="ws-new-input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Folder name…" maxlength="255">';

    var inFlight = false;
    function activate() {
      if (tile.classList.contains('editing')) return;
      tile.classList.add('editing');
      var input = tile.querySelector('.ws-new-input');
      input.value = '';
      input.focus();
    }
    function cancel() {
      tile.classList.remove('editing');
      var input = tile.querySelector('.ws-new-input');
      if (input) input.value = '';
    }
    function commit() {
      if (inFlight) return;
      var input = tile.querySelector('.ws-new-input');
      var name = (input.value || '').trim();
      if (!name) { cancel(); return; }
      if (/[\/\\]/.test(name) || name.startsWith('.') || name.startsWith('-') || name.length > 255) {
        api.toast({ html: 'Invalid folder name', variant: 'warn' });
        input.focus();
        return;
      }
      inFlight = true;
      input.disabled = true;
      fetch('./api/workspace/create', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name })
      })
        .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
        .then(function(res) {
          inFlight = false;
          input.disabled = false;
          if (!res.ok || res.data.error) {
            api.toast({ html: 'Create failed: ' + escapeHtml(res.data.error || 'unknown'), variant: 'warn' });
            input.focus();
            return;
          }
          cancel();
          loadWorkspace();
        })
        .catch(function(err) {
          inFlight = false;
          input.disabled = false;
          api.toast({ html: 'Create failed: ' + escapeHtml(err.message), variant: 'warn' });
          input.focus();
        });
    }

    tile.addEventListener('click', function(e) {
      if (tile.classList.contains('editing')) return;
      if (e.target.closest('.ws-new-input')) return;
      activate();
    });
    tile.addEventListener('keydown', function(e) {
      if (tile.classList.contains('editing')) return;
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); }
    });
    var input = tile.querySelector('.ws-new-input');
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); commit(); }
      else if (e.key === 'Escape') { e.preventDefault(); cancel(); }
    });
    input.addEventListener('blur', function() {
      // small delay so a click on a non-input area inside the tile doesn't blur+commit before the click registers
      setTimeout(function() {
        if (inFlight) return;
        if (!tile.classList.contains('editing')) return;
        if (document.activeElement === input) return;
        var name = (input.value || '').trim();
        if (!name) cancel();
        else commit();
      }, 80);
    });
    return tile;
  }
