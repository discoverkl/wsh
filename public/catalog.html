  // -------- Inline rename --------
  function beginRename(card) {
    var titleEl = card.querySelector('.card-title');
    if (!titleEl || titleEl.classList.contains('editing')) return;
    var original = card.dataset.name;
    titleEl.classList.add('editing');
    titleEl.contentEditable = 'plaintext-only';
    if (titleEl.contentEditable !== 'plaintext-only') titleEl.contentEditable = 'true'; // older browsers
    titleEl.spellcheck = false;
    titleEl.focus();
    var range = document.createRange();
    range.selectNodeContents(titleEl);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);

    function cleanup() {
      titleEl.classList.remove('editing');
      titleEl.removeAttribute('contenteditable');
      titleEl.removeEventListener('keydown', onKey);
      titleEl.removeEventListener('blur', onBlur);
    }
    function commit() {
      var newName = (titleEl.textContent || '').trim();
      cleanup();
      if (!newName || newName === original) {
        titleEl.textContent = original;
        return;
      }
      if (/[\/\\]/.test(newName) || newName.startsWith('.') || newName.startsWith('-')) {
        titleEl.textContent = original;
        api.toast({ html: 'Invalid folder name', variant: 'warn' });
        return;
      }
      // Optimistic update
      titleEl.textContent = newName;
      fetch('./api/workspace/rename', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ from: original, to: newName })
      })
        .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
        .then(function(res) {
          if (!res.ok || res.data.error) {
            titleEl.textContent = original;
            api.toast({ html: 'Rename failed: ' + escapeHtml(res.data.error || 'unknown'), variant: 'warn' });
            return;
          }
          card.dataset.name = newName;
          card.dataset.title = newName;
          card.dataset.app = newName;
          var newPath = res.data.path;
          if (newPath) card.dataset.path = newPath;
          // Refresh the workspace list to re-sort and update Files/Terminal data attrs
          loadWorkspace();
        })
        .catch(function(err) {
          titleEl.textContent = original;
          api.toast({ html: 'Rename failed: ' + escapeHtml(err.message), variant: 'warn' });
        });
    }
    function onKey(e) {
      if (e.key === 'Enter') { e.preventDefault(); titleEl.blur(); }
      else if (e.key === 'Escape') { e.preventDefault(); titleEl.textContent = original; cleanup(); }
    }
    function onBlur() { commit(); }
    titleEl.addEventListener('keydown', onKey);
    titleEl.addEventListener('blur', onBlur);
  }

  // -------- Copy path --------
  function copyPath(p) {
    var done = function() { api.toast({ html: 'Copied <code>' + escapeHtml(p) + '</code>' }); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(p).then(done, function() {
        api.toast({ html: 'Copy failed', variant: 'warn' });
      });
    } else {
      var ta = document.createElement('textarea');
      ta.value = p;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { api.toast({ html: 'Copy failed', variant: 'warn' }); }
      ta.remove();
    }
  }

  // -------- Delete with confirm modal --------
  function confirmDelete(dir, card) {
    var overlay = document.createElement('div');
    overlay.className = 'ws-modal-overlay';
    overlay.innerHTML =
      '<div class="ws-modal" role="dialog" aria-modal="true">' +
        '<div class="ws-modal-title">Delete folder?</div>' +
        '<div class="ws-modal-body">Move <code>' + escapeHtml(dir.path.replace(/^\/root\//, '~/')) + '</code> to the workspace trash. You can restore it from <code>~/.workspace-trash</code>.</div>' +
        '<div class="ws-modal-actions">' +
          '<button type="button" class="ws-modal-btn" data-action="cancel">Cancel</button>' +
          '<button type="button" class="ws-modal-btn danger" data-action="delete">Delete</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(overlay);

    function close() {
      overlay.removeEventListener('keydown', onKey);
      if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
    }
    function onKey(e) {
      if (e.key === 'Escape') { e.preventDefault(); close(); }
      else if (e.key === 'Enter') { e.preventDefault(); doDelete(); }
    }
    function doDelete() {
      var deleteBtn = overlay.querySelector('[data-action="delete"]');
      var cancelBtn = overlay.querySelector('[data-action="cancel"]');
      deleteBtn.disabled = true;
      cancelBtn.disabled = true;
      deleteBtn.textContent = 'Deleting…';
      fetch('./api/workspace/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: dir.name })
      })
        .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
        .then(function(res) {
          if (!res.ok || res.data.error) {
            api.toast({ html: 'Delete failed: ' + escapeHtml(res.data.error || 'unknown'), variant: 'warn' });
            close();
            return;
          }
          close();
          card.classList.add('removing');
          setTimeout(function() { loadWorkspace(); }, 360);
        })
        .catch(function(err) {
          api.toast({ html: 'Delete failed: ' + escapeHtml(err.message), variant: 'warn' });
          close();
        });
    }
    overlay.addEventListener('click', function(e) {
      if (e.target === overlay) close();
      else if (e.target.closest('[data-action="cancel"]')) close();
      else if (e.target.closest('[data-action="delete"]')) doDelete();
    });
    overlay.tabIndex = -1;
    overlay.addEventListener('keydown', onKey);
    overlay.focus();
  }

  // -------- Workspace card click handler --------
  // - Kebab → open menu
  // - Terminal/Files buttons → handled
  // - Anywhere else → launch default agent
  document.addEventListener('click', function(e) {
    var kebab = e.target.closest('.workspace-card .ws-kebab');
    if (kebab) {
      e.preventDefault();
      e.stopPropagation();
      // Toggle: if this kebab already opened the current menu, close it
      if (openMenu && openMenu.kebab === kebab) {
        closeWorkspaceMenu();
        return;
      }
      var card = kebab.closest('.workspace-card');
      var rect = kebab.getBoundingClientRect();
      openWorkspaceMenu(card, { x: rect.right - 200, y: rect.bottom + 6, h: rect.height, flipY: rect.top });
      return;
    }
    var termBtn = e.target.closest('.workspace-card .ws-btn[data-action="terminal"]');
    if (termBtn) {
      e.preventDefault();
      launchWorkspaceTerminal(termBtn.dataset.path, termBtn.dataset.name);
      return;
    }
    if (e.target.closest('.workspace-card .ws-btn[data-action="files"]')) return;
    var card2 = e.target.closest('.workspace-card');
    if (!card2) return;
    // Don't trigger when clicking on title during rename
    if (e.target.closest('.card-title.editing')) return;
    launchDefaultAgent(card2.dataset.path, card2.dataset.name);
  });

  document.addEventListener('keydown', function(e) {
    if (e.key !== 'Enter') return;
    var card = document.activeElement && document.activeElement.classList && document.activeElement.classList.contains('workspace-card')
      ? document.activeElement : null;
    if (!card) return;
    e.preventDefault();
    launchDefaultAgent(card.dataset.path, card.dataset.name);
  });

  function launchDefaultAgent(dirPath, dirName) {
    var agent = workspaceDefaultAgent || 'claude-code';
    fetch('./api/sessions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ app: agent, cwd: dirPath, title: dirName })
    })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data.url) {
          try { var u = new URL(data.url); window.open(u.pathname + u.hash, '_blank'); }
          catch(e) { window.open(data.url, '_blank'); }
        } else if (data.error) {
          api.toast({ html: 'Failed to open agent: ' + escapeHtml(data.error), variant: 'warn' });
        }
      })
      .catch(function(err) {
        api.toast({ html: 'Failed to open agent: ' + escapeHtml(err.message), variant: 'warn' });
      });
  }

  function launchWorkspaceTerminal(dirPath, dirName) {
    fetch('./api/sessions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ app: 'bash', cwd: dirPath, title: dirName })
    })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data.url) {
          try { var u = new URL(data.url); window.open(u.pathname + u.hash, '_blank'); }
          catch(e) { window.open(data.url, '_blank'); }
        } else if (data.error) {
          api.toast({ html: 'Failed to open terminal: ' + escapeHtml(data.error), variant: 'warn' });
        }
      })
      .catch(function(err) {
        api.toast({ html: 'Failed to open terminal: ' + escapeHtml(err.message), variant: 'warn' });
      });
  }

  function loadWorkspace() {
    fetch('./api/workspace')
      .then(function(res) { return res.ok ? res.json() : null; })
      .then(function(data) {
        if (!data) return;
        workspaceDefaultAgent = data.defaultAgent || null;
        renderWorkspace(data.dirs || []);
      })
      .catch(function() {});
  }
  loadWorkspace();

  // RPC control connection for server broadcasts
  connectRpc();

  // api.refreshCatalog — called via eval RPC (e.g. wsh rpc 'api.refreshCatalog()')
  var refreshDebounce = null;
  api.refreshCatalog = function() {
    clearTimeout(refreshDebounce);
    refreshDebounce = setTimeout(function() { window.refreshCatalog(); loadWorkspace(); }, 300);
  };

  // api.sessionReady — called by server when a web app session is ready
  api.sessionReady = function(sessionId, appKey, title) {
    var url = './' + encodeURIComponent(appKey) + '#' + encodeURIComponent(sessionId);
    api.toast({
      html: '<a href="' + escapeAttr(url) + '" target="_blank" style="display:flex;align-items:center;gap:8px;color:inherit;text-decoration:none">'
        + '<span style="width:8px;height:8px;border-radius:50%;background:#22c55e;flex-shrink:0"></span>'
        + '<span style="flex:1"><b>' + escapeHtml(title || appKey) + '</b> is ready</span>'
        + '<span style="font-size:12px;color:#818cf8">Open &#x2197;</span>'
        + '</a>',
      raw: true,
      duration: 15000,
    });
    fetchSessions();
  };

  // Config popover toggle
  document.addEventListener('click', function(e) {
    var toggle = e.target.closest('[data-config-toggle]');
    if (toggle) {
      e.preventDefault();
      e.stopPropagation();
      var popover = toggle.nextElementSibling;
      var wasOpen = popover.classList.contains('open');
      // Close all open popovers
      document.querySelectorAll('.config-popover.open').forEach(function(p) { p.classList.remove('open'); });
      if (!wasOpen) popover.classList.add('open');
      return;
    }
    // Hide button inside popover
    var hideBtn = e.target.closest('[data-hide-app]');
    if (hideBtn) {
      e.preventDefault();
      e.stopPropagation();
      var appKey = hideBtn.getAttribute('data-hide-app');
      hideBtn.textContent = '...';
      fetch('./api/apps/' + encodeURIComponent(appKey) + '/hide', { method: 'POST' })
        .then(function(res) { return res.json(); })
        .then(function() {
          document.querySelectorAll('.config-popover.open').forEach(function(p) { p.classList.remove('open'); });
          var card = hideBtn.closest('.card, .skill-card');
          if (card) hideCard(card, appKey);
        })
        .catch(function() { hideBtn.textContent = 'Hide'; });
      return;
    }
    // Unhide button inside popover — the same button as Hide, flipped. It is
    // the only way back for a card the box ships hidden, so it has to work
    // from inside the expanded run where such cards are the only ones shown.
    var unhideBtn = e.target.closest('[data-unhide-app]');
    if (unhideBtn) {
      e.preventDefault();
      e.stopPropagation();
      var unhideKey = unhideBtn.getAttribute('data-unhide-app');
      unhideBtn.textContent = '...';
      fetch('./api/apps/' + encodeURIComponent(unhideKey) + '/unhide', { method: 'POST' })
        .then(function(res) { return res.json(); })
        .then(function() {
          document.querySelectorAll('.config-popover.open').forEach(function(pop) { pop.classList.remove('open'); });
          var card = unhideBtn.closest('.card, .skill-card');
          if (card) unhideCard(card);
        })
        .catch(function() { unhideBtn.textContent = 'Unhide'; });
      return;
    }
    // Top button inside popover
    var topBtn = e.target.closest('[data-top-app]');
    if (topBtn) {
      e.preventDefault();
      e.stopPropagation();
      var appKey = topBtn.getAttribute('data-top-app');
      topBtn.textContent = '...';
      fetch('./api/apps/' + encodeURIComponent(appKey) + '/top', { method: 'POST' })
        .then(function(res) { return res.json(); })
        .then(function() {
          document.querySelectorAll('.config-popover.open').forEach(function(p) { p.classList.remove('open'); });
          refreshCatalog();
        })
        .catch(function() { topBtn.textContent = 'Top'; });
      return;
    }
    // Untop button inside popover
    var untopBtn = e.target.closest('[data-untop-app]');
    if (untopBtn) {
      e.preventDefault();
      e.stopPropagation();
      var appKey = untopBtn.getAttribute('data-untop-app');
      untopBtn.textContent = '...';
      fetch('./api/apps/' + encodeURIComponent(appKey) + '/untop', { method: 'POST' })
        .then(function(res) { return res.json(); })
        .then(function() {
          document.querySelectorAll('.config-popover.open').forEach(function(p) { p.classList.remove('open'); });
          refreshCatalog();
        })
        .catch(function() { untopBtn.textContent = 'Untop'; });
      return;
    }
    // Set default button inside popover
    var defaultBtn = e.target.closest('[data-default-app]');
    if (defaultBtn) {
      e.preventDefault();
      e.stopPropagation();
      var appKey = defaultBtn.getAttribute('data-default-app');
      defaultBtn.textContent = '...';
      fetch('./api/apps/' + encodeURIComponent(appKey) + '/default', { method: 'POST' })
        .then(function(res) { return res.json(); })
        .then(function() {
          document.querySelectorAll('.config-popover.open').forEach(function(p) { p.classList.remove('open'); });
          refreshCatalog();
        })
        .catch(function() { defaultBtn.textContent = 'Set Default'; });
      return;
    }
    // Unset default button inside popover
    var undefaultBtn = e.target.closest('[data-undefault-app]');
    if (undefaultBtn) {
      e.preventDefault();
      e.stopPropagation();
      var appKey = undefaultBtn.getAttribute('data-undefault-app');
      undefaultBtn.textContent = '...';
      fetch('./api/apps/' + encodeURIComponent(appKey) + '/undefault', { method: 'POST' })
        .then(function(res) { return res.json(); })
        .then(function() {
          document.querySelectorAll('.config-popover.open').forEach(function(p) { p.classList.remove('open'); });
          refreshCatalog();
        })
        .catch(function() { undefaultBtn.textContent = 'Unset Default'; });
      return;
    }
    // Click inside popover — prevent navigating the parent <a>
    if (e.target.closest('.config-popover')) {
      e.preventDefault();
      return;
    }
    // Click outside closes all
    if (!e.target.closest('.config-popover')) {
      document.querySelectorAll('.config-popover.open').forEach(function(p) { p.classList.remove('open'); });
    }
  });

  // Draft persistence helpers
  var DRAFT_PREFIX = 'wsh-skill-draft:';
  function saveDraft(appKey, value) {
    try { if (value) localStorage.setItem(DRAFT_PREFIX + appKey, value); else localStorage.removeItem(DRAFT_PREFIX + appKey); } catch {}
  }
  function loadDraft(appKey) {
    try { return localStorage.getItem(DRAFT_PREFIX + appKey) || ''; } catch { return ''; }
  }

  // Restore drafts after skills render
  function restoreDrafts() {
    var inputs = document.querySelectorAll('.skill-form[data-app] .skill-input');
    for (var i = 0; i < inputs.length; i++) {
      var appKey = inputs[i].closest('.skill-form').dataset.app;
      var draft = loadDraft(appKey);
      if (draft) {
        inputs[i].value = draft;
        inputs[i].style.height = 'auto';
        inputs[i].style.height = Math.min(inputs[i].scrollHeight, 200) + 'px';
        inputs[i].style.overflow = inputs[i].scrollHeight > 200 ? 'auto' : 'hidden';
        var btn = inputs[i].closest('.skill-input-wrap').querySelector('.skill-submit');
        if (btn) btn.classList.add('has-input');
      }
    }
  }

  // Auto-resize textareas, save drafts & Cmd/Ctrl+Enter to submit
  document.getElementById('skills-content').addEventListener('input', function(e) {
    var ta = e.target;
    if (!ta.classList.contains('skill-input')) return;
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 320) + 'px';
    ta.style.overflow = ta.scrollHeight > 320 ? 'auto' : 'hidden';
    var appKey = ta.closest('.skill-form').dataset.app;
    saveDraft(appKey, ta.value);
    var btn = ta.closest('.skill-input-wrap').querySelector('.skill-submit');
    if (btn) btn.classList.toggle('has-input', ta.value.trim().length > 0);
  });
  document.getElementById('skills-content').addEventListener('click', function(e) {
    var newtabBtn = e.target.closest('.skill-newtab');
    if (newtabBtn) {
      var card = newtabBtn.closest('.skill-card');
      var form = card && card.querySelector('.skill-form');
      if (form) { form.dataset.newTab = '1'; form.requestSubmit(); }
      return;
    }
    if (e.target.closest('button') || e.target.closest('.config-popover') || e.target.classList.contains('skill-input') || e.target.closest('a')) return;
    var sel = window.getSelection();
    if (sel && sel.toString().length > 0) return;
    var card = e.target.closest('.skill-card');
    if (!card) return;
    var ta = card.querySelector('.skill-input');
    if (ta && !ta.disabled) ta.focus();
  });

  document.getElementById('skills-content').addEventListener('keydown', function(e) {
    if (!e.target.classList.contains('skill-input')) return;
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      var form = e.target.closest('form');
      if (!form) return;
      if (e.metaKey || e.ctrlKey) {
        form.dataset.newTab = '1';
      }
      form.requestSubmit();
    }
    if (e.key === 'Tab' && !e.shiftKey) {
      var ta = e.target;
      if (ta.value === '' && ta.placeholder && ta.dataset.tips) {
        e.preventDefault();
        ta.value = ta.placeholder;
        var btn = ta.closest('.skill-input-wrap').querySelector('.skill-submit');
        if (btn) btn.classList.add('has-input');
      }
    }
    var passthrough = { Backspace: '\x7f', ArrowUp: '\x1b[A', ArrowDown: '\x1b[B' };
    if ((e.key >= '1' && e.key <= '9' || passthrough[e.key]) && !e.metaKey && !e.ctrlKey && !e.altKey) {
      var ta = e.target;
      if (ta.value === '') {
        var appKey = ta.closest('.skill-form').dataset.app;
        var existing = inlineTerminals[appKey];
        if (existing && existing.isAlive()) {
          e.preventDefault();
          existing.send(passthrough[e.key] || e.key);
          ta.value = '';
          return;
        }
      }
    }
    if (e.key === 'Escape') {
      var appKey = e.target.closest('.skill-form').dataset.app;
      var existing = inlineTerminals[appKey];
      if (existing && existing.isAlive()) {
        existing.send('\x1b');
      }
    }
  });

  // Track active inline terminals per app key
  var inlineTerminals = {};

  document.addEventListener('mt-close', function(e) {
    var card = e.target.closest('.skill-card[data-app]');
    if (card) {
      delete inlineTerminals[card.dataset.app];
      localStorage.removeItem('wsh-inline:' + card.dataset.app);
    }
  });

  document.getElementById('skills-content').addEventListener('submit', function(e) {
    e.preventDefault();
    var form = e.target;
    if (!form.classList.contains('skill-form')) return;
    var appKey = form.dataset.app;
    var newTabFlag = form.dataset.newTab === '1';
    delete form.dataset.newTab;
    var ta = form.querySelector('.skill-input');
    var input = ta.value.trim();
    var btn = form.querySelector('.skill-submit');
    var card = form.closest('.skill-card');

    // If there's a live inline session, send input to it instead of creating a new one
    var existing = inlineTerminals[appKey];
    if (existing && existing.isAlive() && !newTabFlag) {
      if (!input) { existing.send('\r'); ta.value = ''; ta.style.height = 'auto'; saveDraft(appKey, ''); return; }
      var first = input[0];
      var raw = first === '/' || first === '?' || first === '!' || first === '$';
      var usePrefix = card.dataset.slashPrefix !== '0';
      // Codex uses '$' for slash commands; translate prepended prefix and a leading '/'.
      var isCodex = workspaceDefaultAgent === 'codex';
      var slashChar = isCodex ? '$' : '/';
      var rawOut = (isCodex && first === '/') ? '$' + input.slice(1) : input;
      existing.send(raw ? rawOut + '\r' : (usePrefix ? slashChar + appKey + ' ' : '') + input + '\r');
      ta.value = '';
      ta.style.height = 'auto';
      saveDraft(appKey, '');
      return;
    }

    // Raw commands (/, ?, !, $) require a live session — hint the user
    if (input && (input[0] === '/' || input[0] === '?' || input[0] === '!' || input[0] === '$')) {
      var origPlaceholder = ta.getAttribute('placeholder');
      ta.value = '';
      ta.style.height = 'auto';
      saveDraft(appKey, '');
      var submitBtn = form.querySelector('.skill-submit');
      if (submitBtn) submitBtn.classList.remove('has-input');
      ta.setAttribute('placeholder', 'Start a session first — describe your task');
      setTimeout(function() { ta.setAttribute('placeholder', origPlaceholder || 'Describe your task...'); }, 3000);
      return;
    }

    btn.disabled = true;
    ta.disabled = true;

    fetch('./api/sessions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ app: appKey, input: input, mode: newTabFlag ? '' : 'inline' })
    })
    .then(function(res) { return res.json(); })
    .then(function(data) {
      btn.disabled = false;
      ta.disabled = false;
      ta.value = '';
      ta.style.height = 'auto';
      saveDraft(appKey, '');
      if (data.url) {
        if (newTabFlag) {
          try { var u = new URL(data.url); window.open(u.pathname + u.hash, '_blank'); }
          catch(e2) { window.open(data.url, '_blank'); }
        } else {
          var wrap = card.querySelector('.skill-inline-wrap');
          // Dispose existing inline terminal if any
          wrap.innerHTML = '';
          var handle = MiniTerminal.create(wrap, data.id, data.url);
          inlineTerminals[appKey] = handle;
          localStorage.setItem('wsh-inline:' + appKey, JSON.stringify({ id: data.id, url: data.url }));
          // Keep focus on the skill input (desktop only — avoid keyboard popup on touch)
          if (!document.documentElement.classList.contains('touch')) ta.focus();
        }
      }
      else if (data.error) showError(data.error);
    })
    .catch(function(err) {
      btn.disabled = false;
      ta.disabled = false;
      showError('Failed to launch: ' + err.message);
    });
  });
})();
</script>
</body>
